<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Birth Rate Decline</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="container">
        <h1>Why Are Birth Rates Declining?</h1>
        <p>
            Explore how GDP, education, and urbanization influence fertility trends across countries.
        </p>

        <div id="controls">
            <label>
                Year:
                <input type="range" id="yearSlider" step="1">
                <span id="yearLabel"></span>
              </label>
        </div>

        <div class="vis-grid">
            <div>
                <h3>World Map</h3>
                <div id="map"></div>
            </div>
        </div>

        <div id="lifestyle-analysis">
            <h3>The Modernity Trap: Digital Lifestyle vs. Fertility by Region</h3>
            <div class="lifestyle-controls">
                <label>
                    Lifestyle Year:
                    <input type="range" id="lifestyle-year-slider" min="1990" max="2024" step="1" value="2024">
                </label>
                <div class="lifestyle-year-readout">
                    Currently Selected Lifestyle Year: <span id="lifestyle-year-label">2024</span>
                </div>
            </div>
            <div id="lifestyle-chart"></div>
        </div>

        <div id="tooltip"></div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    <script src="js/script.js"></script>
</body>
</html>
