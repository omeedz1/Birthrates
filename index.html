<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Birth Rate Decline</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="container">
        <h1>The Global Fertility Decline And Its Contributing Factors</h1>
        <p>
            Explore how GDP, education, and urbanization influence fertility trends across countries.
        </p>

        <div id="introduction">
            <h3>Since 1990, Average Global Fertility Has Fallen Every Year</h3>
            <div id="intro-tooltip" style="display:none"></div> 
            <div id="intro-vis"></div>
        </div>

        <div id="controls">
            <label>
                Year:
                <input type="range" id="yearSlider" step="1">
                <span id="yearLabel"></span>
              </label>
        </div>

        <div class="vis-grid">
            <div>
                <h3>World Map</h3>
                <div id="map"></div>
            </div>
        </div>

        <div id="tooltip"></div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    <script src="js/script.js"></script>
</body>
</html>
